name: Build NIC reference masters

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-contact-acquisition
    paths:
      - '.github/workflows/build-nic-masters.yml'
      - 'scripts/import-nic-1998.js'
      - 'scripts/import-nic-2004.js'
      - 'scripts/import-nic-2008.js'
      - 'scripts/classify-companies.js'
      - 'cin-industry-model.js'
      - 'tests/**'
      - 'data/companies.json'
      - 'data/nic/sources.json'
      - 'data/nic/cin-code-overrides.json'
      - 'data/nic/apply-wizz-sector-map-1998.json'
      - 'data/nic/apply-wizz-sector-map.json'

permissions:
  contents: write

jobs:
  build-masters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: phase2-contact-acquisition
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Import NIC-1998 master
        run: node scripts/import-nic-1998.js

      - name: Import NIC-2004 master
        run: node scripts/import-nic-2004.js

      - name: Import NIC-2008 master
        run: node scripts/import-nic-2008.js

      - name: Run classification tests
        run: node --test tests/*.test.js

      - name: Validate generated masters
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const expected = {
            'data/nic/nic-1998.json': 950,
            'data/nic/nic-2004.json': 1100,
            'data/nic/nic-2008.json': 1000,
          };
          for (const [file, minimum] of Object.entries(expected)) {
            const parsed = JSON.parse(fs.readFileSync(file,'utf8'));
            if (!Array.isArray(parsed.rows) || parsed.rows.length < minimum) throw new Error(`${file}: insufficient rows`);
            if (!parsed.meta?.nic_version) throw new Error(`${file}: missing version metadata`);
            console.log(file, parsed.meta.nic_version, parsed.rows.length);
          }
          NODE

      - name: Generate company classifications
        run: node scripts/classify-companies.js

      - name: Validate derivative classification output
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync('data/companies.json','utf8'));
          const classified = JSON.parse(fs.readFileSync('data/companies-classified.json','utf8'));
          const report = JSON.parse(fs.readFileSync('data/classification-report.json','utf8'));
          if (!Array.isArray(source) || !Array.isArray(classified)) throw new Error('company files must be arrays');
          if (source.length !== classified.length) throw new Error(`row count mismatch: ${source.length} vs ${classified.length}`);
          if (report.source_count !== source.length || report.summary.total !== source.length) throw new Error('classification report count mismatch');
          for (let i = 0; i < source.length; i++) {
            for (const [key, value] of Object.entries(source[i])) {
              if (JSON.stringify(classified[i][key]) !== JSON.stringify(value)) throw new Error(`source field changed at row ${i}: ${key}`);
            }
          }
          console.log(JSON.stringify(report.summary, null, 2));
          NODE
          git diff --exit-code -- data/companies.json

      - name: Commit generated reference and classification data
        run: |
          git config user.name 'Apply Wizz Data Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/nic/nic-1998.json data/nic/nic-2004.json data/nic/nic-2008.json data/companies-classified.json data/classification-report.json
          if git diff --cached --quiet; then
            echo 'No generated data changes to commit.'
            exit 0
          fi
          git commit -m 'data: generate audited CIN classifications'
          git push origin HEAD:phase2-contact-acquisition
